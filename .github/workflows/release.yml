# Publishes the package to npm when a version tag such as v0.1.0 is pushed.
# It uses npm Trusted Publishing: npm trusts this workflow through GitHub's OIDC token, so the
# repository needs no NPM_TOKEN secret. The one-time setup on npmjs.com is in docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub release after publishing.
      contents: write
      # Lets npm exchange GitHub's OIDC token for a publish token and sign the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later; the npm bundled with Node 24 may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The steps above ran what prepublishOnly runs, so the scripts are skipped here.
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts

      # The release notes are this version's section of CHANGELOG.md.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
